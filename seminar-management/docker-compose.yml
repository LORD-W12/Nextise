version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seminar-management-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/seminar_db?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-supersecret_change_me_in_production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-jwt_supersecret_change_in_production}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-noreply@seminar-hub.local}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - seminar-network

  db:
    image: postgres:15-alpine
    container_name: seminar-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=seminar_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seminar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seminar-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: seminar-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    networks:
      - seminar-network

volumes:
  postgres_data:

networks:
  seminar-network:
    driver: bridge
